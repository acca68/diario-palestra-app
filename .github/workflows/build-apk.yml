# Diario Palestra: compila l'APK da installare sul telefono.
# Parte a ogni push su main e a mano dalla scheda Actions ("Run workflow").
# L'APK si scarica dalla pagina della run, sezione Artifacts.
name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Compila APK debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: diario-palestra-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Pubblica sul link fisso
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la app/build/outputs/apk/debug/
          apk=$(ls app/build/outputs/apk/debug/*.apk | grep -i universal || true)
          [ -n "$apk" ] || apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$apk" diario-palestra.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima diario-palestra.apk \
            --title "Diario Palestra - ultima versione" \
            --notes "Compilata dal commit ${GITHUB_SHA::7} il $(date -u +%d.%m.%Y)." \
            --latest

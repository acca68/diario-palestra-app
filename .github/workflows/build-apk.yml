# Diario Palestra: compila l'APK da installare sul telefono.
# Parte a ogni push su main e a mano dalla scheda Actions ("Run workflow").
# L'APK si scarica dalla pagina della run, sezione Artifacts.
name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Compila APK debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: diario-palestra-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
